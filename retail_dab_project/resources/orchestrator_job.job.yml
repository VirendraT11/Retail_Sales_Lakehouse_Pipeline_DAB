# Top-level orchestrator: runs ingestion, then refreshes the Silver/Gold pipeline.

resources:
  jobs:
    retail_pipeline_orchestrator:
      name: retail_pipeline_orchestrator

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      email_notifications:
        on_failure:
          - virendra.tambavekar@celebaltech.com

      tasks:
        - task_key: run_ingestion
          run_job_task:
            job_id: ${resources.jobs.ingestion_job.id}
            job_parameters:
              catalog: ${var.catalog}
              schema: raw
              num_transactions: "8000000"

        - task_key: refresh_gold_pipeline
          depends_on:
            - task_key: run_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail_dab_project_etl.id}