# The main pipeline for retail_dab_project

resources:
  pipelines:
    retail_dab_project_etl:
      name: retail_dab_project_etl
      catalog: ${var.catalog}
      schema: silver 
      serverless: true
      root_path: "../src/retail_dab_project_etl"

      libraries:
        - glob:
            include: ../src/retail_dab_project_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
